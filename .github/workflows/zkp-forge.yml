name: Compile ZKP Circuit

on:
  workflow_dispatch:

jobs:
  forge-cryptography:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install SnarkJS
        run: npm install -g snarkjs
        
      - name: Install Circom Compiler
        run: |
          curl -sL https://github.com/iden3/circom/releases/download/v2.1.6/circom-linux-amd64 -o circom
          chmod +x circom
          sudo mv circom /usr/local/bin/
          
      - name: Execute Cryptographic Circuit Build
        run: |
          mkdir -p zkp_engine
          cd zkp_engine
          
          # 1. Forge the Circuit
          echo 'pragma circom 2.0.0; template IdentityAssert() { signal input secret; signal input publicHash; signal output out; out <== secret * publicHash; } component main {public [publicHash]} = IdentityAssert();' > circuit.circom
          
          circom circuit.circom --r1cs --wasm --sym
          
          # 2. Forge Local Entropy (Bypasses all AWS/S3 Network Blocks)
          snarkjs powersoftau new bn128 8 pot08_0000.ptau -v
          echo "zeroassert_entropy_1" | snarkjs powersoftau contribute pot08_0000.ptau pot08_0001.ptau --name="Phase1" -v
          snarkjs powersoftau prepare phase2 pot08_0001.ptau pot08_final.ptau -v
          
          # 3. Setup and ZKey Generation
          snarkjs groth16 setup circuit.r1cs pot08_final.ptau circuit_0000.zkey
          echo "zeroassert_entropy_2" | snarkjs zkey contribute circuit_0000.zkey circuit_final.zkey --name="ZeroAssert" -v
          
          # 4. Export Verification Key
          snarkjs zkey export verificationkey circuit_final.zkey verification_key.json
          
      - name: Commit Keys to Repository
        run: |
          mkdir -p public/zkp
          cp zkp_engine/circuit_js/circuit.wasm public/zkp/
          cp zkp_engine/circuit_final.zkey public/zkp/
          cp zkp_engine/verification_key.json app/api/verify/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/zkp/circuit.wasm public/zkp/circuit_final.zkey app/api/verify/verification_key.json
          git commit -m "chore: forge real zero-knowledge keys" || echo "Bypassing empty commit lock"
          git push
          
