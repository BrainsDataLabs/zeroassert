name: Compile ZKP Circuit

on:
  workflow_dispatch: # Allows manual trigger from your phone

jobs:
  forge-cryptography:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install SnarkJS
        run: npm install -g snarkjs
        
      - name: Install Circom Compiler
        run: |
          curl -LO https://github.com/iden3/circom/releases/latest/download/circom-linux-amd64
          chmod +x circom-linux-amd64
          sudo mv circom-linux-amd64 /usr/local/bin/circom
          
      - name: Execute Cryptographic Circuit Build
        run: |
          mkdir -p zkp_engine
          cd zkp_engine
          
          # 1. Write the base identity circuit
          echo "template IdentityAssert() { signal input secret; signal input publicHash; signal output out; out <== secret * publicHash; } component main = IdentityAssert();" > circuit.circom
          
          # 2. Compile to WebAssembly
          circom circuit.circom --r1cs --wasm --sym
          
          # 3. Download Polygon Hermez Powers of Tau (Entropy)
          wget https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_12.ptau
          
          # 4. Generate the Proving Key
          snarkjs groth16 setup circuit.r1cs powersOfTau28_hez_final_12.ptau circuit_0000.zkey
          echo "zeroassert_secure_entropy_generation_9982" | snarkjs zkey contribute circuit_0000.zkey circuit_final.zkey --name="ZeroAssert" -v
          
          # 5. Extract Verification Key
          snarkjs zkey export verificationkey circuit_final.zkey verification_key.json
          
      - name: Commit Keys to Repository
        run: |
          mkdir -p public/zkp
          cp zkp_engine/circuit_js/circuit.wasm public/zkp/
          cp zkp_engine/circuit_final.zkey public/zkp/
          cp zkp_engine/verification_key.json app/api/verify/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/zkp/circuit.wasm public/zkp/circuit_final.zkey app/api/verify/verification_key.json
          git commit -m "chore: forge zero-knowledge cryptographic keys"
          git push
          
